apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - csi-controller.yaml
  - csi-node.yaml
  - recovery-backend.yaml
  - storageclass.yaml
  - csidriver.yaml

images:
  - name: hcloud-csi-rwx
    newName: ghcr.io/mrhein/hcloud-csi-rwx
    newTag: v0.1.0

# Common labels applied to all resources
labels:
  - pairs:
      app.kubernetes.io/name: hcloud-csi-rwx
      app.kubernetes.io/version: v0.1.0
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
