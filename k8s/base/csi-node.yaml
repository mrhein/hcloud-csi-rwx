# CSI Node Plugin — DaemonSet, runs on every node, mounts NFS shares
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hcloud-csi-rwx-csi-node
  namespace: hcloud-csi-rwx
  labels:
    app: hcloud-csi-rwx-csi-node
spec:
  selector:
    matchLabels:
      app: hcloud-csi-rwx-csi-node
  template:
    metadata:
      labels:
        app: hcloud-csi-rwx-csi-node
    spec:
      serviceAccountName: hcloud-csi-rwx-node
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: csi-driver
          image: hcloud-csi-rwx
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/hcloud-csi-rwx-csi"]
          securityContext:
            privileged: true
          env:
            - name: RUST_LOG
              value: "info"
            - name: CSI_ENDPOINT
              value: "unix:///csi/csi.sock"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/hcloud-csi-rwx/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/hcloud-csi-rwx
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
