apiVersion: v1
kind: Service
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  clusterIP: None            # headless: only WordPress talks to it
  selector:
    app.kubernetes.io/name: wordpress-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-db
  namespace: wordpress
  labels:
    app.kubernetes.io/name: wordpress-db
spec:
  replicas: 1
  strategy:
    type: Recreate           # single RWO volume — never two writers
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999        # mysql user in the mariadb image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb:11.4
          args:
            - --skip-name-resolve
            - --skip-symbolic-links
          env:
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress-db, key: password }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress-db, key: root-password }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3306
              name: mysql
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: run,  mountPath: /run/mysqld }
            - { name: tmp,  mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wordpress-db
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
